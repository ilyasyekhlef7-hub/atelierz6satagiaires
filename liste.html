<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    :root{color-scheme:light;--ink:#183b35;--muted:#6b817a;--paper:#f6f3ea;--card:#fffdf8;--line:#dedfd4;--green:#1e564b;--green-dark:#153e36;--clay:#cf7657;--soft:#e8eee6;--shadow:0 18px 48px rgba(24,59,53,.1)}
    *{box-sizing:border-box}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 90% 0%,#e6eee3 0,transparent 32%),var(--paper);margin:0;padding:clamp(24px,5vw,56px) 20px;color:var(--ink);min-height:100vh}
    header{max-width:1080px;margin:0 auto 30px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;background:var(--card);border:1px solid rgba(24,59,53,.08);border-radius:18px;box-shadow:var(--shadow)}
    header a{color:var(--green);text-decoration:none;font-weight:750;white-space:nowrap;transition:color .2s}
    header a:hover{color:var(--clay)}
    h1{margin:0;font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:-.04em;color:var(--ink)}
    #grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
    .item{background:var(--card);border:1px solid rgba(24,59,53,.07);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(24,59,53,.08);transition:transform .22s,box-shadow .22s}
    .item:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(24,59,53,.14)}
    .item img{width:100%;height:230px;object-fit:cover;background:var(--soft);display:block}
    .info{padding:16px 18px 19px;border-top:3px solid var(--clay)}
    .info strong{display:block;font-size:1.05rem;letter-spacing:-.02em;color:var(--ink);margin-bottom:5px}
    .info span{color:var(--muted);font-size:.92rem}
    #status{max-width:1080px;margin:30px auto;text-align:center;color:var(--muted);padding:34px 20px;background:rgba(255,253,248,.78);border:1px dashed var(--line);border-radius:16px}
    @media(max-width:560px){body{padding:18px 14px}header{padding:17px 18px;align-items:flex-start;flex-direction:column}header a{font-size:.95rem}#grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}.item img{height:175px}.info{padding:13px 14px 15px}}
</style>
</head>
<body>
  <header>
    <h1>Liste des stagiaires</h1>
    <a href="index.html">+ Nouvelle inscription</a>
  </header>
  <p id="status">Chargement...</p>
  <div id="grid"></div>

  <script>
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#e5e7eb"/><text x="100" y="108" font-size="14" text-anchor="middle" fill="#9ca3af">Pas de photo</text></svg>'
    );

    async function charger() {
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/liste.php');
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        if (json.data.length === 0) { status.textContent = 'Aucun stagiaire inscrit.'; return; }
        status.style.display = 'none';

        json.data.forEach((s) => {
          const item = document.createElement('div');
          item.className = 'item';

          const img = document.createElement('img');
          img.alt = s.prenom + ' ' + s.nom;
          img.src = s.photo.startsWith('http') ? s.photo : PLACEHOLDER;
          img.onerror = () => { img.src = PLACEHOLDER; };

          const info = document.createElement('div');
          info.className = 'info';
          const nom = document.createElement('strong');
          nom.textContent = s.prenom + ' ' + s.nom;
          const ville = document.createElement('span');
          ville.textContent = s.ville;
          info.append(nom, ville);

          item.append(img, info);
          grid.appendChild(item);
        });
      } catch (err) {
        status.textContent = 'Erreur de chargement : ' + err.message;
      }
    }
    charger();
  </script>
</body>
</html>
